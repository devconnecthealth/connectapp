<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Health — Portal de Sistemas</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo_ConnectHealth_light.png" />

  <!-- Google Fonts: Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <!-- Header with Logo -->
    <header class="header">
      <img src="logo_ConnectHealth_light.png" alt="Connect Health Logo" class="logo-img" />
      <h1 class="portal-title">Sistemas & Ferramentas Internas</h1>
      <p class="portal-subtitle">Selecione o sistema que deseja acessar:</p>
    </header>

    <!-- App launcher -->
    <main class="app-grid">

      <!-- Connect Monitor -->
      <a class="app-tile" href="https://connecthealth.duckdns.org/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon icon-indigo">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </span>
        <span class="app-name">Connect Monitor</span>
      </a>

      <!-- Produtos -->
      <a class="app-tile" href="https://preco-produtos-a6yy.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon icon-cyan">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 9 5-9 5-9-5 9-5z"></path>
            <path d="M3 8v9l9 5 9-5V8"></path>
            <path d="M12 13v9"></path>
            <path d="m7.5 5.5 9 5"></path>
          </svg>
        </span>
        <span class="app-name">Produtos</span>
      </a>

      <!-- Simulador de Preço -->
      <a class="app-tile" href="https://simulador-ashen-two.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon icon-cyan">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="8" y1="10" x2="8" y2="10"></line>
            <line x1="12" y1="10" x2="12" y2="10"></line>
            <line x1="16" y1="10" x2="16" y2="10"></line>
            <line x1="8" y1="14" x2="8" y2="14"></line>
            <line x1="12" y1="14" x2="12" y2="14"></line>
            <line x1="16" y1="14" x2="16" y2="14"></line>
            <line x1="8" y1="18" x2="8" y2="18"></line>
            <line x1="12" y1="18" x2="16" y2="18"></line>
          </svg>
        </span>
        <span class="app-name">Simulador de Preço</span>
      </a>

      <!-- Gerador de Proposta -->
      <a class="app-tile" href="https://geradorconnect.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon icon-emerald">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="16" y2="17"></line>
          </svg>
        </span>
        <span class="app-name">Gerador de Proposta</span>
      </a>

      <!-- Monitor de Remessas -->
      <a class="app-tile" href="https://memphis-five.vercel.app/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon icon-indigo">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
            <path d="M15 18H9"></path>
            <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
            <circle cx="17" cy="18" r="2"></circle>
            <circle cx="7" cy="18" r="2"></circle>
          </svg>
        </span>
        <span class="app-name">Monitor de Remessas</span>
      </a>

      <!-- ERP Connect (em breve) -->
      <a class="app-tile app-soon" href="https://erp-connect-psi.vercel.app/" target="_blank" rel="noopener noreferrer" title="Em breve — versão de prévia">
        <span class="app-icon icon-amber">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
          </svg>
          <span class="soon-dot"></span>
        </span>
        <span class="app-name">ERP Connect</span>
      </a>

    </main>

    <!-- Simple Footer -->
    <footer class="footer">
      <p>Connect Health &bull; Uso Interno</p>
    </footer>

  </div>
</body>
</html>
